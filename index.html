<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>老鼠图片库</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐭</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>老鼠图片库</h1>
  <input type="search" id="q" placeholder="搜索">
  <div class="row">
    <label>排序
      <select id="sort">
        <option value="time-desc">时间 ↓</option>
        <option value="time-asc">时间 ↑</option>
        <option value="name-asc">名称 A→Z</option>
        <option value="name-desc">名称 Z→A</option>
      </select>
    </label>
    <button id="editBtn">编辑</button>
    <button id="batchBtn">批量</button>
    <button id="clearFilters">清空</button>
    <span id="count"></span>
  </div>
  <div class="tags" id="tagbar"></div>
  <details>
    <summary>标签层级</summary>
    <textarea id="treeInput" rows="5"></textarea>
    <button id="saveTreeBtn">保存</button>
  </details>
</header>

<div id="grid"></div>
<div id="pager"></div>
<div id="lightbox"></div>
<div id="toast"></div>

<div id="batchBar">
  <div class="batch-row">
    <span id="batchCount">已选 0</span>
    <button id="batchAddBtn">加</button>
    <button id="batchRemoveBtn">去</button>
    <button id="batchAllBtn">全选</button>
    <button id="batchNoneBtn">清空</button>
    <button id="batchExitBtn">退出</button>
  </div>
  <div id="batchTagPicker"></div>
</div>

<div id="editPanel">
  <div class="edit-title" id="editTitle"></div>
  <div class="edit-body">
    <label>标签</label>
    <input type="text" id="editTags">
    <div id="editCands"></div>
    <label>备注</label>
    <input type="text" id="editNote">
    <label>时间</label>
    <input type="datetime-local" id="editTime">
    <div class="edit-actions">
      <button id="editSave">保存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
